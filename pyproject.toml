[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py310"

[tool.mypy]
python_version = "3.10"

[[tool.mypy.overrides]]
module = ["PIL", "PIL.*", "snowballstemmer", "sentence_transformers", "sentence_transformers.*"]
ignore_missing_imports = true
